[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detour"
version = "0.1.0"
description = "Heading-aware ranking of 'nearest stop' suggestions for a moving vehicle, with a reproducible benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]
pbf = ["osmium>=4"]

[tool.setuptools.packages.find]
include = ["detour*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
